name: Test and deploy wedding sites to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site: test
            workspace: '@wedding/test'
            project: onda-wedding-test
            firebase_project: wedding-app-onda
            domain: test.ondadeideias.com
    environment:
      name: site-${{ matrix.site }}
      url: ${{ steps.pages.outputs.url }}
    concurrency:
      group: cloudflare-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate site configuration and build
        run: npm run env:check --workspace "${{ matrix.workspace }}" -- production && npm run build --workspace "${{ matrix.workspace }}"
        env:
          EXPECTED_FIREBASE_PROJECT_ID: ${{ matrix.firebase_project }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
      - name: Ensure Cloudflare project exists
        id: pages
        run: node scripts/ensure-pages-project.js "${{ matrix.project }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish site
        id: publish
        run: npx wrangler pages deploy "sites/${{ matrix.site }}/dist" --project-name "${{ matrix.project }}" --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Register custom domain
        run: node scripts/ensure-pages-project.js "${{ matrix.project }}" "${{ matrix.domain }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests on published site
        run: npm run test:e2e -- --grep 'site público|entrada direta|clicar novamente'
        env:
          E2E_BASE_URL: ${{ steps.pages.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.site }}-reports
          path: test-results/
          if-no-files-found: ignore
