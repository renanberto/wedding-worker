name: Diagnose Cloudflare custom domain

on:
  workflow_dispatch:
    inputs:
      retry_validation:
        description: Retry validation of a pending domain after inspecting its status
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  domain-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Cloudflare validation status
        run: node scripts/pages-domain-status.js onda-wedding-test test.ondadeideias.com
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RETRY_VALIDATION: ${{ inputs.retry_validation }}
      - name: Check public DNS
        run: |
          node --input-type=module <<'JS'
          for (const [name, type] of [['test.ondadeideias.com', 'CNAME'], ['test.ondadeideias.com', 'A'], ['test.ondadeideias.com', 'AAAA'], ['test.ondadeideias.com', 'CAA'], ['ondadeideias.com', 'CAA']]) {
            const response = await fetch(`https://dns.google/resolve?name=${name}&type=${type}`, { signal: AbortSignal.timeout(15000) });
            const data = await response.json();
            console.log(JSON.stringify({ name, type, status: data.Status, answers: data.Answer || [] }));
          }
          JS
      - name: Check domain HTTPS directly at Cloudflare
        continue-on-error: true
        run: curl -I --connect-timeout 10 --max-time 20 --connect-to test.ondadeideias.com:443:onda-wedding-test.pages.dev:443 https://test.ondadeideias.com
